<!DOCTYPE html>
<html lang="fil">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#15171c">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../assets/js/icons.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/prefs.js"></script>
<title>Videoke</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Doto:wght@700..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/host.css">
</head>
<body>
<div id="gate">
  <div class="gate-top">
    <span class="wordmark"><i data-i="mic"></i>videoke</span>
    <div class="gate-acts"><button class="theme-toggle"></button><a class="close-x" href="../" title="Isara"></a></div>
  </div>
  <div class="gate-body">
    <h1>Handa na ang TV</h1>
    <p class="muted">Pindutin para payagan ng browser na tumunog ang kanta. Pagkatapos, F para fullscreen.</p>
    <button class="btn primary gate-btn" id="gateBtn"><i data-i="play"></i><span>Simulan</span></button>
  </div>
</div>

<div id="stage">
  <canvas id="scene" aria-hidden="true"></canvas>
  <video id="vid" playsinline preload="auto"></video>
  <div id="ytWrap"><div id="ytPlayer"></div></div>

  <!-- top bar: laging nakikita, parang tunay na videoke -->
  <div id="topBar">
    <div id="nowTag"></div>
    <div id="nextBar" class="reserved"></div>
    <div class="tb-clock"><span class="dot" id="tbClock"></span><span id="tbAmpm"></span></div>
  </div>

  <div id="audioStage">
    <div id="aTitle"><div class="t" id="aT"></div><div class="a" id="aA"></div><div class="s" id="aS"></div></div>
    <div id="lyrics"><div id="lyCur"></div><div id="lyNext"></div></div>
    <div id="noLrc">Walang lyrics para sa kantang ito</div>
    <audio id="aud" preload="auto"></audio>
  </div>

  <!-- attract screen kapag walang kanta -->
  <div id="idle">
    <div class="idle-panel">
      <div class="idle-time"><span class="dot" id="idleClock"></span><span id="idleAmpm"></span></div>
      <div class="idle-date" id="idleDate"></div>
      <p class="hint" id="idleHint">I-scan ang QR code gamit ang camera ng phone para mag-reserve ng kanta.</p>
    </div>
    <div class="qr-card">
      <div id="qrBig"></div>
      <div class="qr-room"><span>Room</span><b class="dot" id="roomCode">----</b></div>
      <p class="url" id="remoteUrl"></p>
    </div>
  </div>

  <div id="splash">
    <span class="sp-lbl">Song no.</span>
    <div class="dot sp-num" id="spNum"></div>
    <div class="sp-t" id="spT"></div>
    <div class="sp-a" id="spA"></div>
    <div class="sp-s" id="spS"></div>
  </div>
  <div id="cornerQr"><div id="qrSmall"></div><div class="dot rc" id="roomSmall"></div></div>
  <div id="pauseBadge"><div><i data-i="pause"></i>Naka-pause</div></div>
  <div id="volBadge"></div>

  <div id="topBtns">
    <button class="tb" id="btnSkip" title="Laktawan (N)"><i data-i="next"></i><span>Laktawan</span></button>
    <button class="tb" id="btnScene" title="Palitan ang background (B)"><i data-i="film"></i><span>Background</span></button>
    <button class="tb" id="btnNewRoom" title="Bagong room code"><i data-i="refresh"></i><span>Bagong room</span></button>
    <button class="tb" id="btnFs" title="Fullscreen (F)" aria-label="Fullscreen"><i data-i="fullscreen"></i></button>
    <button class="theme-toggle"></button>
    <button class="tb" id="btnClose" title="Isara" aria-label="Isara"><i data-i="x"></i></button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/scenes.js"></script>
<script src="../assets/js/host.js"></script>
<script src="../assets/js/screensaver.js"></script>
</body>
</html>
