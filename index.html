<!DOCTYPE html>
<html lang="fil">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Videoke</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    background: radial-gradient(ellipse at top, #2b1250 0%, var(--bg) 60%); }
  .wrap { width: 100%; max-width: 760px; text-align: center; }
  h1 { font-size: clamp(42px, 9vw, 76px); margin: 0 0 6px; letter-spacing: 2px; }
  .sub { margin-bottom: 34px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .card { display: block; text-decoration: none; color: var(--text); background: var(--card); border: 1px solid var(--line);
    border-radius: 20px; padding: 26px 18px; transition: transform .15s, border-color .2s; }
  .card:hover, .card:active { transform: translateY(-3px); border-color: var(--pink); }
  .card .ico { font-size: 46px; }
  .card b { display: block; font-size: 20px; margin: 10px 0 4px; }
  .card span { font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="neon">🎤 VIDEOKE</h1>
  <div class="sub muted">Pambahay na videoke — TV, laptop, tablet at phone</div>
  <div class="grid">
    <a class="card" href="host/"><div class="ico">📺</div><b>Host</b><span>Buksan sa laptop/tablet na naka-HDMI sa TV</span></a>
    <a class="card" href="remote/"><div class="ico">📱</div><b>Remote</b><span>Mag-reserve ng kanta gamit ang phone</span></a>
    <a class="card" href="admin/"><div class="ico">🛠️</div><b>Admin</b><span>Mag-upload ng kanta sa library</span></a>
  </div>
</div>
</body>
</html>
