<!DOCTYPE html>
<html lang="fil" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15171c">
<script src="../assets/js/icons.js?v=0.9.10"></script>
<script src="../assets/js/theme.js?v=0.9.10"></script>
<script src="../assets/js/prefs.js?v=0.9.10"></script>
<script src="../assets/js/i18n.js?v=0.9.10"></script>
<script src="../assets/js/wallpaper.js?v=0.9.10"></script>
<title>Videoke Songbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Doto:wght@700..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css?v=0.9.10">
<link rel="stylesheet" href="../assets/css/songbook.css?v=0.9.10">
</head>
<body>
<div class="app">
  <header class="bar">
    <a class="close-x" href="../" title="Isara"></a>
    <div class="ttl"><h1>Songbook</h1><span class="muted" id="count">Naglo-load</span></div>
    <button class="theme-toggle"></button>
  </header>

  <div class="tools">
    <div class="search"><i data-i="search"></i><input id="q" placeholder="Hanapin ang title, artist o numero" autocomplete="off" type="search"></div>
    <div class="row-tools">
      <div class="seg" id="sortSeg" aria-label="Ayusin ayon sa">
        <button data-sort="code" class="on">Numero</button>
        <button data-sort="title">Title</button>
        <button data-sort="artist">Artist</button>
      </div>

    </div>
    <div class="chips" id="catChips"></div>
    <div class="letters" id="letters"></div>
    <div id="roomInfo" class="room-info"></div>
  </div>

  <div id="list" class="book"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js?v=0.9.10"></script>
<script src="../assets/js/common.js?v=0.9.10"></script>
<script src="../assets/js/songbook.js?v=0.9.10"></script>
<script src="../assets/js/screensaver.js?v=0.9.10"></script>
</body>
</html>
