<!DOCTYPE html>
<!-- YouTube player para sa VideokeTana Android app (TV screen).
     Nasa sariling site ito para may tamang origin ang player (kung wala, "This video is unavailable" / error 152).
     Kinokontrol ng app gamit ang load()/cmd(); ibinabalik ang mga event sa AndroidYT.event(). -->
<html lang="fil" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>VideokeTana player</title>
<style>html, body { margin: 0; height: 100%; background: #000; overflow: hidden; } #p { width: 100%; height: 100%; }</style>
</head>
<body>
<div id="p"></div>
<script>
var player = null, ready = false, pending = null, want = null, kick = null, apiOk = false, rate = 1;
function send(e, d) { try { AndroidYT.event(e, String(d == null ? '' : d)); } catch (x) {} }
// kung hindi ma-load ang YouTube API sa loob ng 12s, sabihin sa app
setTimeout(function () { if (!apiOk) send('error', 'noapi'); }, 12000);
var tag = document.createElement('script'); tag.onerror = function () { send('error', 'noapi'); }; tag.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(tag);
function onYouTubeIframeAPIReady() {
  apiOk = true;
  player = new YT.Player('p', {
    width: '100%', height: '100%',
    playerVars: { origin: location.origin, widget_referrer: location.href, autoplay: 1, controls: 0, rel: 0, modestbranding: 1, playsinline: 1, iv_load_policy: 3, fs: 0, disablekb: 1 },
    events: {
      onReady: function () { ready = true; send('ready'); if (pending) { load(pending.id, pending.v); pending = null; } },
      onStateChange: function (e) {
        send('state', e.data);
        if (e.data === 1) { clearTimeout(kick); if (player.getPlaybackRate() !== rate) player.setPlaybackRate(rate); if (player.isMuted() && want && want.v > 0) { player.unMute(); player.setVolume(want.v); } }
      },
      onError: function (e) { send('error', e.data); }
    }
  });
}
function load(id, v) {
  if (!ready) { pending = { id: id, v: v }; return; }
  want = { id: id, v: v };
  player.loadVideoById(id);
  if (v != null) player.setVolume(v);
  // kung hindi nagsimula (naharang ang autoplay), subukan ulit; huli, i-mute muna para payagan
  clearTimeout(kick);
  kick = setTimeout(function () {
    var st = player.getPlayerState();
    if (st === 1) return;
    player.playVideo();
    kick = setTimeout(function () {
      if (player.getPlayerState() === 1) return;
      player.mute(); player.playVideo();
    }, 2500);
  }, 2000);
}
// oras ng video bawat 2s (para masabayan ng maliit na video sa phone)
setInterval(function () { try { if (ready && player.getPlayerState() === 1) send('time', player.getCurrentTime().toFixed(2)); } catch (x) {} }, 2000);
function cmd(c, a) {
  if (c === 'rate') rate = a || 1;
  if (!ready) return;
  if (c === 'pause') player.pauseVideo();
  else if (c === 'play') player.playVideo();
  else if (c === 'seek') player.seekTo(a || 0, true);
  else if (c === 'vol') player.setVolume(a);
  else if (c === 'mute') { player.mute(); }
  else if (c === 'rate') { rate = a || 1; player.setPlaybackRate(rate); }
  else if (c === 'stop') { clearTimeout(kick); want = null; player.stopVideo(); }
}
</script>
</body>
</html>
