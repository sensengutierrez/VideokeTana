<!DOCTYPE html>
<!-- Mic lang (para sa loob ng Android app kapag web ang TV). Walang pangalan na tinatanong, walang ibang laman. -->
<html lang="fil" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>VideokeTana mic</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; color: #eceef1; font: 15px/1.4 system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 20px; box-sizing: border-box; text-align: center; }
  .ring { position: relative; width: 170px; height: 170px; display: grid; place-items: center; }
  .halo { position: absolute; width: 120px; height: 120px; border-radius: 50%; background: rgba(98,227,210,.18); transform: scale(1); transition: transform .08s; }
  button.mic { position: relative; width: 120px; height: 120px; border-radius: 50%; border: 1px solid rgba(255,255,255,.1); cursor: pointer;
    background: linear-gradient(#232832, #161a21); display: grid; place-items: center; }
  button.mic.on { background: linear-gradient(#62e3d2, #3fc7b6); border-color: #62e3d2; }
  button.mic.busy { animation: p 1s infinite alternate; }
  @keyframes p { to { opacity: .6; } }
  button.mic svg { width: 52px; height: 52px; stroke: #fff; fill: none; stroke-width: 1.8; stroke-linecap: round; }
  button.mic.on svg { stroke: #062320; }
  b { font-size: 18px; } small { color: #949baa; max-width: 34ch; }
  .acts { display: flex; gap: 10px; margin-top: 6px; }
  .acts button { height: 42px; padding: 0 18px; border-radius: 999px; border: 1px solid #2e333d; background: #1d2027; color: #eceef1; font-weight: 700; }
  .acts .stop { color: #ff7a7a; }
</style>
</head>
<body>
<div class="wrap">
  <div class="ring"><span class="halo" id="halo"></span>
    <button class="mic" id="micBtn" aria-label="Mic"><svg viewBox="0 0 24 24"><path d="M12 2.5a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0v-6a3 3 0 0 1 3-3Z"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5v4M8.5 21.5h7"/></svg></button>
  </div>
  <b id="st">Pindutin para buksan ang mic</b>
  <small id="sub">Ang boses mo ay ipapadala sa TV (web) ng room na ito.</small>
  <div class="acts" id="acts" hidden><button id="mute">I-mute</button><button class="stop" id="stop">Itigil</button></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js?v=0.13.2"></script>
<script src="../assets/js/common.js?v=0.13.2"></script>
<script src="../assets/js/mic-remote.js?v=0.13.2"></script>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const ROOM = cleanRoom(q.get('room') || '');
  const NAME = (q.get('name') || 'Mic').slice(0, 40);
  const en = q.get('lang') === 'en';
  const T = {
    off: [en ? 'Tap to turn on the mic' : 'Pindutin para buksan ang mic', ''],
    asking: [en ? 'Allow the microphone' : 'Payagan ang mic', ''],
    connecting: [en ? 'Connecting to the TV…' : 'Kumokonekta sa TV…', ''],
    connected: [en ? 'Mic is on: sing!' : 'Bukas ang mic: kumanta na!', ''],
    reconnecting: [en ? 'Reconnecting…' : 'Kumokonekta ulit…', ''],
    noanswer: [en ? 'The TV is not answering' : 'Hindi sumasagot ang TV', en ? 'Is the TV page open and started?' : 'Bukas at naka-Simulan ba ang TV?'],
    denied: [en ? 'Microphone blocked' : 'Naka-block ang mic', ''],
    nomic: [en ? 'No microphone found' : 'Walang mic', ''],
    unsupported: [en ? 'Not supported here' : 'Hindi kaya dito', ''],
    error: [en ? 'Mic error' : 'May error sa mic', '']
  };
  const $ = id => document.getElementById(id);
  const ch = sb.channel('room-' + ROOM, { config: { broadcast: { self: false } } })
    .on('broadcast', { event: 'rtc' }, ({ payload }) => VKMicRemote.handle(payload))
    .subscribe();
  VKMicRemote.init(msg => ch.send({ type: 'broadcast', event: 'rtc', payload: msg }), (s, info) => {
    const t = T[s] || T.error;
    $('st').textContent = t[0]; $('sub').textContent = t[1] || (info ? String(info) : $('sub').textContent);
    if (s === 'connected') { try { VKMicRemote.rename(NAME); } catch (e) {} }
    $('micBtn').classList.toggle('on', s === 'connected');
    $('micBtn').classList.toggle('busy', ['asking', 'connecting', 'reconnecting', 'noanswer'].includes(s));
    $('acts').hidden = !['asking', 'connecting', 'connected', 'reconnecting', 'noanswer'].includes(s);
  });
  (function meter() { requestAnimationFrame(meter); $('halo').style.transform = 'scale(' + (1 + Math.min(0.45, VKMicRemote.level() * 2.5)) + ')'; })();
  $('micBtn').onclick = () => { if (!VKMicRemote.isOn()) VKMicRemote.start({ clean: true }); };
  $('stop').onclick = () => { VKMicRemote.stop(); $('mute').textContent = en ? 'Mute' : 'I-mute'; };
  $('mute').onclick = () => { const m = !VKMicRemote.isMuted(); VKMicRemote.setMuted(m); $('mute').textContent = m ? (en ? 'Unmute' : 'I-unmute') : (en ? 'Mute' : 'I-mute'); };
  window.addEventListener('pagehide', () => { if (VKMicRemote.isOn()) VKMicRemote.stop(); });
})();
</script>
</body>
</html>
