<!DOCTYPE html>
<html lang="fil" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15171c">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../assets/icons/favicon-48.png">
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="../assets/js/icons.js?v=0.10.0"></script>
<script src="../assets/js/theme.js?v=0.10.0"></script>
<script src="../assets/js/prefs.js?v=0.10.0"></script>
<script src="../assets/js/i18n.js?v=0.10.0"></script>
<script src="../assets/js/wallpaper.js?v=0.10.0"></script>
<title>VideokeTana: Kanta sa device</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Doto:wght@700..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css?v=0.10.0">
<link rel="stylesheet" href="../assets/css/mysongs.css?v=0.10.0">
</head>
<body>
<div class="app">
  <header class="bar">
    <a class="close-x" href="../" title="Isara"></a>
    <div class="ttl"><h1>Kanta sa device</h1><span class="muted" id="count">Naglo-load</span></div>
    <button class="theme-toggle"></button>
  </header>

  <section class="display store" aria-label="Storage">
    <div class="st-row"><span>Gamit na storage ng mga kanta</span><b translate="no" class="dot" id="stSongs">0 MB</b></div>
    <div class="st-bar"><b id="stBar"></b></div>
    <div class="st-row small"><span id="stFree"></span><span id="stKeep"></span></div>
  </section>

  <label class="drop" id="drop">
    <input type="file" id="files" multiple accept="audio/*,video/*,.lrc,.mp3,.m4a,.mp4,.webm">
    <i data-i="upload"></i>
    <b>Magdagdag ng kanta mula sa device</b>
    <small>MP3, M4A, MP4 o WebM, at .lrc para sa lyrics na kapareho ang pangalan ng file. Hindi ina-upload: dito lang sa device na ito naka-save, at dito lang ito tutugtog.</small>
  </label>

  <p class="hint">Idagdag ang kanta sa device na nagsisilbing <b>TV</b> (laptop, tablet o Smart TV app). Ang mga phone ay makakapag-reserve gamit ang numero, 90001 pataas.</p>

  <div id="list" class="book"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js?v=0.10.0"></script>
<script src="../assets/js/common.js?v=0.10.0"></script>
<script src="../assets/js/localsongs.js?v=0.10.0"></script>
<script src="../assets/js/mysongs.js?v=0.10.0"></script>
<script src="../assets/js/screensaver.js?v=0.10.0"></script>
</body>
</html>
