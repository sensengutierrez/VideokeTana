<!DOCTYPE html>
<!-- Pansamantala: lumang link (hal. /VideokeTana/remote/?room=ABCD) -> /VideokeTana/frontend/remote/?room=ABCD -->
<html lang="fil" translate="no"><head><meta charset="UTF-8"><title>Videoke</title>
<script>
  // github.io/VideokeTana/remote/ -> github.io/VideokeTana/frontend/remote/ ; custom domain: /remote/ -> /frontend/remote/
  var pre = location.hostname.endsWith('github.io') ? (location.pathname.match(/^\/[^\/]+\//) || ['/'])[0] : '/';
  var rest = location.pathname.slice(pre.length);
  if (rest.indexOf('frontend/') !== 0) location.replace(pre + 'frontend/' + rest + location.search + location.hash);
</script>
</head><body style="background:#14171c;color:#eee;font-family:sans-serif;padding:2em">Hindi makita ang page.</body></html>
